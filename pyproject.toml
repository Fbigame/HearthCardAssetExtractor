[build-system]
requires = ["setuptools>=42", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "hearthstone-card-asset-extractor"
version = "1.0.1"
requires-python = ">=3.12"

dependencies = [
    "nuitka>=4.1.3",
    "pythonnet>=3.1.0",
    "unitypy>=1.25.2",
]


[project.scripts]
card-asset = "cli:main"
build = "build_script:build"
